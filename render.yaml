services:
  # Backend API
  - type: web
    name: project-handler-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: project-handler-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: project-handler-redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false

  # Frontend (Static Site)
  - type: web
    name: project-handler-frontend
    env: static
    buildCommand: echo "No build needed for static site"
    staticPublishPath: ./frontend/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Databases
databases:
  - name: project-handler-db
    databaseName: project_handler
    plan: free

# Redis
  - type: redis
    name: project-handler-redis
    plan: free
    maxmemoryPolicy: noeviction
